# =============================================================================
#  Inventaire des cEOS lu dans NAUTOBOT (hôtes + groupes), en lecture seule.
#  Importé par 300-observabilite.yml et 310-experience-panne.yml.
#
#  Source  : les équipements du site « nautobot_site » (alimentés par `make nautobot-sync`).
#  Groupes : le rôle Nautobot donne le groupe Ansible (P → p, PE → pe, CE → ce) ;
#            tous sont aussi dans `arista_ceos` (connexion eAPI : group_vars/arista_ceos.yml).
#  Hôtes   : le nom Nautobot = le nom du nœud ; host_vars/<nœud>.yml s'applique comme d'habitude.
#  Adresse : le nom lui-même (containerlab l'inscrit dans /etc/hosts de la VM Lab).
#  Jeton   : NAUTOBOT_TOKEN dans l'environnement (posé par le Makefile, jamais dans le dépôt).
#  Données : group_vars/all/observabilite.yml (nautobot_url, nautobot_site, nautobot_roles).
# =============================================================================
- name: "Inventaire — hôtes et groupes lus dans Nautobot (lecture seule)"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Jeton et adresse de Nautobot renseignés
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'NAUTOBOT_TOKEN') | length > 0
          - nautobot_url is search('^http://[^/:]+:[0-9]+$')
        fail_msg: "NAUTOBOT_TOKEN absent, ou TOOLS_VM_IP vide (nautobot_url = {{ nautobot_url }}). Lancer via make."
        quiet: true

    - name: "Équipements du site {{ nautobot_site }}, un appel par rôle"
      ansible.builtin.uri:
        url: "{{ nautobot_url }}/api/dcim/devices/?{{ {'location': nautobot_site, 'role': item.key, 'limit': 500} | urlencode }}"
        headers:
          Authorization: "Token {{ lookup('ansible.builtin.env', 'NAUTOBOT_TOKEN') }}"
          Accept: application/json
      loop: "{{ nautobot_roles | dict2items }}"
      loop_control:
        label: "rôle {{ item.key }}"
      register: nb_devices
      changed_when: false

    - name: "Nautobot contient les nœuds attendus (sinon, make nautobot-sync)"
      ansible.builtin.assert:
        that: (nb_devices.results | map(attribute='json.count') | map('int') | sum) == (nb_noeuds | int)
        fail_msg: >-
          Nautobot renvoie {{ nb_devices.results | map(attribute='json.count') | map('int') | sum }} équipement(s)
          pour le site « {{ nautobot_site }} », {{ nb_noeuds }} attendus. Lancer make nautobot-sync.
        quiet: true

    - name: Hôtes et groupes ajoutés à l'inventaire de cette exécution
      ansible.builtin.add_host:
        name: "{{ item.1.name }}"
        groups: ["arista_ceos", "{{ item.0.item.value }}"]
        ansible_host: "{{ item.1.name }}"
      loop: "{{ nb_devices.results | subelements('json.results') }}"
      loop_control:
        label: "{{ item.1.name }} → {{ item.0.item.value }}"
      changed_when: false
