# Crée un objet Nautobot s'il n'existe pas encore (GET puis POST)
- name: "Existe ? {{ obj.endpoint }} {{ obj.filtre }}"
  ansible.builtin.uri:
    url: "{{ nb_url }}/api/{{ obj.endpoint }}/?{{ obj.filtre | replace(' ', '%20') }}"
    headers: "{{ nb_headers }}"
  register: existe

- name: "Création {{ obj.endpoint }} {{ obj.filtre }}"
  when: existe.json.count == 0
  ansible.builtin.uri:
    url: "{{ nb_url }}/api/{{ obj.endpoint }}/"
    method: POST
    headers: "{{ nb_headers }}"
    body_format: json
    body: "{{ obj.body }}"
    status_code: 201
  changed_when: true