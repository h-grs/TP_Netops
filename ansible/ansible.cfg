[defaults]
# Deux inventaires, fusionnés par Ansible (chemins relatifs à ce fichier) :
#  - QUI  : ../clab-netops/ansible-inventory.yml, GÉNÉRÉ par containerlab au deploy (nœuds, groupes, IP de mgmt)
#  - QUOI : sot/hosts.yml (vide) → charge sot/host_vars/, fabriqué depuis Nautobot par make sot-pull
inventory = ../clab-netops/ansible-inventory.yml,sot/hosts.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml

[persistent_connection]
connect_timeout = 30
command_timeout = 60