[defaults]
# Inventaire GÉNÉRÉ par containerlab au deploy (jamais écrit à la main).
# Chemin relatif à ce fichier : <racine du dépôt>/clab-netops/ansible-inventory.yml
inventory = ../clab-netops/ansible-inventory.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml

[persistent_connection]
connect_timeout = 30
command_timeout = 60
