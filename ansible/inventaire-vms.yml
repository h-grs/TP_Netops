# =============================================================================
#  O1 : la VM Lab elle-même (connexion locale). gnmic s'y installe en service systemd :
#  il faut sudo (/opt, /etc/gnmic, utilisateur système, unité systemd) → make o1 K=1.
#  O2 / O3 tournent sur la VM Tools en Docker Compose (tools/observabilite/), pas par Ansible.
# =============================================================================
all:
  children:
    lab_vm:
      hosts:
        lab-vm:
          ansible_connection: local
          ansible_become: true