# P1 — cœur + Route Reflector VPNv4 (rôle désigné dans group_vars/all/network.yml : rr: p1)
# Aucune VRF : il reflète des routes clients sans jamais les installer dans sa RIB.
loopback: 10.0.0.1
interfaces_coeur:
  - {nom: Ethernet1, ip: 10.10.0.1/31, vers: pe1}
  - {nom: Ethernet2, ip: 10.10.0.2/31, vers: p2}
