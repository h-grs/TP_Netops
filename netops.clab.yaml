# =============================================================================
#  TP NetOps — MPLS L3VPN — Jalon 1 : « le lab existe »
#  13 conteneurs : 9 cEOS (2 P, 3 PE, 4 CE) + 4 hôtes Linux
#
#  Ce fichier ne décrit QUE le câblage, le management et les hôtes.
#  Toute la config réseau des cEOS (loopbacks, OSPF, LDP, BGP, VRF) arrive en J2
#  par Ansible/eAPI : rien n'est tapé à la main sur un équipement.
#
#  Déployer : make deploy      Détruire : make destroy      Vérifier : make check
# =============================================================================
name: netops

mgmt:
  network: netops-mgmt          # bridge dédié : n'interfère pas avec d'autres labs
  ipv4-subnet: 172.20.20.0/24   # hors bande — jamais annoncé dans OSPF ni dans les VRF

topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.1F       # version épinglée, présente sur VM_Lab
    linux:
      # Image déjà présente sur VM_Lab (iproute2, ping, iperf3, tcpdump).
      # Épinglée par digest, car son tag est "latest" (interdit, cf. J3) :
      #   make pin-hosts   remplace la ligne ci-dessous par le digest exact
      image: ghcr.io/srl-labs/network-multitool:latest

  nodes:
    # ---------------------------------------------------------------- Cœur (P)
    p1:     # P + Route Reflector
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.11
      labels: {ansible-group: p}
    p2:     # P pur : OSPF + LDP, aucun BGP
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.12
      labels: {ansible-group: p}

    # --------------------------------------------------------------- Bordure (PE)
    pe1:    # Paris — TENANT_1 + TENANT_2
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.21
      labels: {ansible-group: pe}
    pe2:    # Bordeaux — TENANT_2
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.22
      labels: {ansible-group: pe}
    pe3:    # Avignon — TENANT_1
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.23
      labels: {ansible-group: pe}

    # --------------------------------------------------------------- Clients (CE)
    cea-1:  # Filiale A — Paris
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.31
      labels: {ansible-group: ce}
    ceb-1:  # Filiale B — Paris
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.32
      labels: {ansible-group: ce}
    ceb-2:  # Filiale B — Bordeaux
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.33
      labels: {ansible-group: ce}
    cea-2:  # Filiale A — Avignon
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.34
      labels: {ansible-group: ce}

    # ------------------------------------------------------------- Hôtes Linux
    # Postes utilisateurs : une passerelle, pas de protocole de routage.
    # Route 192.168.0.0/16 (et non "default") pour garder eth0 = management.
    lc1:    # TENANT_1 Paris, derrière cea-1
      kind: linux
      mgmt-ipv4: 172.20.20.41
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.1.1
    lc2:    # TENANT_2 Paris, derrière ceb-1
      kind: linux
      mgmt-ipv4: 172.20.20.42
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.17.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.17.1
    lc3:    # TENANT_2 Bordeaux, derrière ceb-2
      kind: linux
      mgmt-ipv4: 172.20.20.43
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.18.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.18.1
    lc4:    # TENANT_1 Avignon, derrière cea-2
      kind: linux
      mgmt-ipv4: 172.20.20.44
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.2.1

  # ethN côté containerlab = EthernetN côté EOS
  links:
    # ---- Cœur (OSPF aire 0 + LDP en J2) : chaîne PE1 – P1 – P2 – PE2/PE3
    - endpoints: ["p1:eth1", "pe1:eth1"]
    - endpoints: ["p1:eth2", "p2:eth1"]
    - endpoints: ["p2:eth2", "pe2:eth1"]
    - endpoints: ["p2:eth3", "pe3:eth1"]
    # ---- Liens de secours (optionnels, test de panne O3) — décommenter si voulu
    # - endpoints: ["p2:eth4", "pe1:eth4"]
    # - endpoints: ["p1:eth3", "pe2:eth3"]
    # - endpoints: ["p1:eth4", "pe3:eth3"]

    # ---- PE – CE (eBGP dans la VRF en J2)
    - endpoints: ["pe1:eth2", "cea-1:eth1"]   # TENANT_1
    - endpoints: ["pe1:eth3", "ceb-1:eth1"]   # TENANT_2
    - endpoints: ["pe2:eth2", "ceb-2:eth1"]   # TENANT_2
    - endpoints: ["pe3:eth2", "cea-2:eth1"]   # TENANT_1

    # ---- CE – hôte (LAN du site)
    - endpoints: ["cea-1:eth2", "lc1:eth1"]
    - endpoints: ["ceb-1:eth2", "lc2:eth1"]
    - endpoints: ["ceb-2:eth2", "lc3:eth1"]
    - endpoints: ["cea-2:eth2", "lc4:eth1"]

