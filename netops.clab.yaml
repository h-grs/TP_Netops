name: netops

# Préfixe vide : le conteneur s'appelle exactement comme le nœud (p1, pe1...).
prefix: ""

mgmt:
  network: netops-mgmt          
  ipv4-subnet: 172.20.20.0/24   # hors bande — jamais annoncé dans OSPF ni dans les VRF

topology:
  # `kinds` = valeurs par défaut partagées par tous les nœuds d'un même type
  kinds:
    arista_ceos:
      image: ceos:4.36.1F       # version épinglée, présente sur VM_Lab
      env:
        CLAB_MGMT_VRF: MGMT
    linux:
      # Image déjà présente sur VM_Lab (iproute2, ping, iperf3, tcpdump).
      # Son tag est "latest" (interdit, cf. J3) : à remplacer par le digest exact
      # de l'image locale (image: ghcr.io/...@sha256:...) puis commit.
      image: ghcr.io/srl-labs/network-multitool:latest

  # `labels: {ansible-group: X}` : containerlab range le nœud dans le groupe X de
  # l'inventaire Ansible généré. Groupes p / pe / ce / lc -> les playbooks J2
  # ciblent `hosts: pe`
  nodes:
    # ---------------------------------------------------------------- Cœur (P)
    p1:     # P + Route Reflector VPNv4 (aucune VRF)
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.11
      labels: {ansible-group: p}
    p2:     # P pur : OSPF + LDP
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.12
      labels: {ansible-group: p}

    # --------------------------------------------------------------- Bordure (PE)
    pe1:    # Paris — CLIENT 1 (VRFA) + CLIENT 2 (VRFB)
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.21
      labels: {ansible-group: pe}
    pe2:    # Bordeaux — CLIENT 2
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.22
      labels: {ansible-group: pe}
    pe3:    # Avignon — CLIENT 1
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.23
      labels: {ansible-group: pe}

    # --------------------------------------------------------------- Clients (CE)
    cea-1:  # CLIENT 1 site A — Paris
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.31
      labels: {ansible-group: ce}
    ceb-1:  # CLIENT 2 site A — Paris
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.32
      labels: {ansible-group: ce}
    ceb-2:  # CLIENT 2 site B — Bordeaux
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.33
      labels: {ansible-group: ce}
    cea-2:  # CLIENT 1 site B — Avignon
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.34
      labels: {ansible-group: ce}

    # ------------------------------------------------------------- Hôtes Linux
    lc1:    # CLIENT 1 site A — Paris, derrière cea-1
      kind: linux
      mgmt-ipv4: 172.20.20.41
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.0.2/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.0.1
    lc2:    # CLIENT 2 site A — Paris, derrière ceb-1
      kind: linux
      mgmt-ipv4: 172.20.20.42
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.0.2/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.0.1
    lc3:    # CLIENT 2 site B — Bordeaux, derrière ceb-2
      kind: linux
      mgmt-ipv4: 172.20.20.43
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.1.2/24 dev eth1
        - ip route add 192.168.0.0/24 via 192.168.1.1
    lc4:    # CLIENT 1 site B — Avignon, derrière cea-2
      kind: linux
      mgmt-ipv4: 172.20.20.44
      labels: {ansible-group: lc}
      exec:
        - ip addr add 192.168.1.2/24 dev eth1
        - ip route add 192.168.0.0/24 via 192.168.1.1

  # Les adresses IP des liens sont dans host_vars/<nœud>.yml, pas ici.
  links:
    # ---- Cœur (OSPF aire 0 + LDP en J2) : chaîne PE1 – P1 – P2 – PE2/PE3
    - endpoints: ["p1:eth1", "pe1:eth1"]
    - endpoints: ["p1:eth2", "p2:eth1"]
    - endpoints: ["p2:eth2", "pe2:eth1"]
    - endpoints: ["p2:eth3", "pe3:eth1"]

    # ---- PE – CE (eBGP dans la VRF en J2)
    - endpoints: ["pe1:eth2", "cea-1:eth1"]   # CLIENT 1
    - endpoints: ["pe1:eth3", "ceb-1:eth1"]   # CLIENT 2
    - endpoints: ["pe2:eth2", "ceb-2:eth1"]   # CLIENT 2
    - endpoints: ["pe3:eth2", "cea-2:eth1"]   # CLIENT 1

    # ---- CE – hôte (LAN du site)
    - endpoints: ["cea-1:eth2", "lc1:eth1"]
    - endpoints: ["ceb-1:eth2", "lc2:eth1"]
    - endpoints: ["ceb-2:eth2", "lc3:eth1"]
    - endpoints: ["cea-2:eth2", "lc4:eth1"]
