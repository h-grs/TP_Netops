# O3 — source de données provisionnée par fichier
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090              # nom du service dans compose.yaml
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s                      # = pas de scrape : sert à calculer $__rate_interval
