# O3 — tableau de bord provisionné par fichier (JSON versionné dans ../../dashboards)
apiVersion: 1
providers:
  - name: netops
    orgId: 1
    folder: NetOps
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
