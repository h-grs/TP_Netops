# O2 — Prometheus collecte l'endpoint exposé par gnmic (O1) sur la VM Lab (modèle pull)
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gnmic
    static_configs:
      - targets: ["10.200.4.120:9804"]        # VM Lab : gnmic, sortie Prometheus
    metric_relabel_configs:
      # étiquettes lisibles dans Grafana (gnmic les nomme d'après le chemin OpenConfig)
      - source_labels: [interface_name]
        target_label: interface
      - source_labels: [network_instance_name]
        target_label: vrf                      # « default » = table globale, sinon VRFA / VRFB
      - source_labels: [neighbor_neighbor_address]
        target_label: voisin
